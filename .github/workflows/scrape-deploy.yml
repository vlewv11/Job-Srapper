name: Scrape & Deploy

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore the per-channel watermarks and re-read the whole window"
        type: boolean
        default: false
      days:
        description: "Window in days"
        type: string
        default: "30"
      source:
        description: "Where to read posts from"
        type: choice
        default: auto
        options: [auto, preview, telegram]
  push:
    branches: [master]
    paths:
      - "src/**"
      - "main.py"
      - "channels.txt"
      - ".github/workflows/scrape-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

env:
  STATE_BRANCH: state
  DB_PATH: data/vacancies.db
  RETENTION_DAYS: "30"
  SCRAPE_INTERVAL_MINUTES: "10"
  SITE_DIR: site
  # Public channels are read straight off t.me/s/, so a cycle needs no Telegram
  # credentials at all. The MTProto pass only runs for channels that serve no web
  # preview, and only when the secrets below happen to be set.
  SCRAPE_SOURCE: ${{ inputs.source || 'auto' }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Restore the database
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git show FETCH_HEAD:vacancies.db > "$DB_PATH"
            echo "Restored $(du -h "$DB_PATH" | cut -f1) from '$STATE_BRANCH'."
          else
            echo "No '$STATE_BRANCH' branch yet — starting from an empty database."
          fi

      # No continue-on-error: a cycle that reads nothing must fail the run and
      # show up red. Masking it here is what let a dead session go unnoticed for
      # three days while the site kept redeploying stale data.
      - name: Scrape
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FULL: ${{ inputs.full && '--full' || '' }}
          DAYS: ${{ inputs.days || '30' }}
        run: |
          uv run python main.py scrape --days "$DAYS" $FULL \
            --summary "$RUNNER_TEMP/counts.json"

      - name: Summarise the cycle
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/counts.json" ] || exit 0
          python3 - "$RUNNER_TEMP/counts.json" <<'PY'
          import json, os, sys

          c = json.load(open(sys.argv[1]))
          line = (
              f"{c['channels']} channel(s) · +{c['matched']} vacancies from "
              f"{c['messages']} post(s) · pruned {c['pruned']} · "
              f"{c['errors']} error(s)"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(line + "\n")
          if c["errors"]:
              # Surfaced as an annotation on the run: a degraded cycle stays
              # visible even though it still published.
              print(f"::warning::{line}")
          PY

      - name: Persist the database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w "$DB_PATH")
          tree=$(printf '100644 blob %s\tvacancies.db\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          git push --force origin "$commit:refs/heads/$STATE_BRANCH"

      - name: Build the static dashboard
        run: |
          uv run python main.py build
          ls -la "$SITE_DIR"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
